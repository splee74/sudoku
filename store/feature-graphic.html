<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대표 그림 (1024×500)</title>
<!--
  플레이스토어 "그래픽 이미지(1024×500)"를 만드는 페이지입니다.
  글자를 고친 뒤 store/make-images.js 를 다시 돌리면 feature-graphic.png 가 새로 만들어집니다.
  그림 : img/gate.webp (시작 그림), img/chars.webp (등급별 고양이)
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, #8cc3fb 0%, #c4e1fe 55%, #e9f5ff 100%);
    color: #1d2f6b; word-break: keep-all;
  }
  /* 오른쪽 : 시작 그림에서 고양이와 판 부분 (왼쪽 가장자리는 하늘로 스며들게) */
  .art {
    position: absolute; right: 0; top: 0; width: 520px; height: 500px;
    background: url("../img/gate.webp") no-repeat;
    background-size: 560px auto;           /* 941×1672 → 560×995 */
    background-position: -20px -360px;     /* 고양이 얼굴과 판 윗부분이 가운데 오게 */
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 120px);
    mask-image: linear-gradient(90deg, transparent 0, #000 120px);
  }
  .text { position: absolute; left: 56px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .crown { font-size: 40px; line-height: 1; margin-bottom: 4px; }
  h1 {
    font-size: 84px; font-weight: 900; letter-spacing: -3px; line-height: 1.02; color: #1d2f6b;
    text-shadow: 0 4px 0 #fff, 0 -2px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 10px 18px rgba(30, 60, 140, 0.25);
  }
  h1 span { color: #2d6fe0; }
  .tag { margin-top: 18px; font-size: 27px; font-weight: 800; line-height: 1.4; color: #24407e; }
  .cats { display: flex; align-items: flex-end; gap: 6px; margin-top: 22px; }
  .cat {
    width: 74px; height: 74px; border-radius: 50%;
    background: #fff url("../img/chars.webp") 0 0 / 1400% 600% no-repeat;
    border: 3px solid #fff; box-shadow: 0 4px 10px rgba(30, 60, 140, 0.25);
  }
  .cat.big { width: 92px; height: 92px; }
  .arrow { align-self: center; font-size: 26px; font-weight: 900; color: #2d6fe0; margin: 0 2px; }
</style>
</head>
<body>
  <div class="art" aria-hidden="true"></div>
  <div class="text">
    <div class="crown" aria-hidden="true">👑</div>
    <h1>스도쿠<br><span>승급전</span></h1>
    <p class="tag">하수에서 신까지, 미션을 깨며<br>한 단계씩 올라가는 스도쿠</p>
    <div class="cats" id="cats"></div>
  </div>
  <script>
    // 등급별 고양이 (chars.webp 의 칸 번호 : 0 = 가장 낮은 등급 … 13 = 가장 높은 등급), 기본 표정 줄
    var cols = [0, 4, 9, 13];
    var box = document.getElementById('cats');
    cols.forEach(function (c, i) {
      if (i) {
        var a = document.createElement('span');
        a.className = 'arrow';
        a.textContent = '›';
        box.appendChild(a);
      }
      var el = document.createElement('span');
      el.className = 'cat' + (i === cols.length - 1 ? ' big' : '');
      el.style.backgroundPosition = (c / 13) * 100 + '% 20%'; // 2번째 줄(기쁨) = 1/5 = 20%
      box.appendChild(el);
    });
  </script>
</body>
</html>
