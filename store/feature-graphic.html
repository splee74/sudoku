<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대표 그림 (1024×500)</title>
<!--
  플레이스토어 "그래픽 이미지(1024×500)"를 만드는 페이지입니다.
  글자를 고친 뒤 store/make-images.js 를 다시 돌리면 feature-graphic.png 가 새로 만들어집니다.
  그림 : img/home-dojo.webp (숫자 도장 마당), img/gate-cast.webp (주인공 · 사부 · 깜냥), img/title.webp (제목 글씨)
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: #e9d9bd; color: #4a2c12; word-break: keep-all;
  }
  /* 뒤 : 숫자 도장 마당 (지붕과 숫자판이 보이게) */
  .yard {
    position: absolute; inset: 0;
    background: url("../img/home-dojo.webp") no-repeat;
    background-size: 1024px auto;          /* 880×1184 → 1024×1378 */
    background-position: 0 -60px;
  }
  /* 글자가 잘 읽히게 왼쪽을 따뜻한 빛으로 덮음 */
  .glow {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(250, 238, 214, 0.94) 0, rgba(250, 238, 214, 0.86) 40%, rgba(250, 238, 214, 0) 64%);
  }
  /* 오른쪽 : 주인공 · 사부 · 깜냥 */
  .cast {
    position: absolute; right: -6px; bottom: -40px; width: 520px; height: auto;
    filter: drop-shadow(0 10px 18px rgba(60, 30, 0, 0.35));
  }
  .text { position: absolute; left: 50px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; }
  .title { width: 470px; height: auto; display: block; filter: drop-shadow(0 6px 10px rgba(60, 30, 0, 0.25)); }
  .sub { margin: 6px 0 0 6px; font-size: 30px; font-weight: 900; color: #8a4b12; letter-spacing: 1px; }
  .tag { margin: 22px 0 0 8px; font-size: 27px; font-weight: 800; line-height: 1.45; color: #4a2c12; }
  .tag b { color: #c0581a; }
</style>
</head>
<body>
  <div class="yard" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <img class="cast" src="../img/gate-cast.webp" alt="">
  <div class="text">
    <img class="title" src="../img/title.webp" alt="스도쿠 승급전">
    <p class="sub">~ 숫자 도장의 전설 ~</p>
    <p class="tag">하수에서 신까지, <b>미션</b>을 깨며<br>한 단계씩 올라가는 스도쿠</p>
  </div>
</body>
</html>
